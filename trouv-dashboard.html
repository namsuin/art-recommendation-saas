<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouv Art - 작품 관리 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Google Tag Manager (GTM-KXJJQWWN)
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-KXJJQWWN');
    </script>
</head>
<body class="bg-gray-100">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KXJJQWWN"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    
    <div id="root" class="min-h-screen">
        <!-- Loading placeholder -->
        <div class="container mx-auto px-4 py-8">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
                Trouv Art - 작품 관리 대시보드
            </h1>
            <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-gray-600">대시보드 로딩 중...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const createRoot = ReactDOM.createRoot || ((container) => {
            return {
                render: (element) => ReactDOM.render(element, container)
            };
        });

        // API Base URL - 배포된 art-recommendation-saas API 사용
        const API_BASE_URL = 'https://art-recommendation-saas.onrender.com';

        const ArtworkDashboard = () => {
            const [artworks, setArtworks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);
            const [totalPages, setTotalPages] = useState(1);
            const [totalArtworks, setTotalArtworks] = useState(0);
            const [searchQuery, setSearchQuery] = useState('');
            const [itemsPerPage, setItemsPerPage] = useState(20);

            const fetchArtworks = async (page = 1, search = '', limit = 20) => {
                try {
                    setLoading(true);
                    const params = new URLSearchParams({
                        page: page.toString(),
                        limit: limit.toString(),
                        search: search
                    });
                    
                    const response = await fetch(`${API_BASE_URL}/api/admin/artworks?${params}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        setArtworks(data.artworks || []);
                        setTotalPages(data.pagination?.totalPages || 1);
                        setTotalArtworks(data.pagination?.total || 0);
                    } else {
                        throw new Error(data.error || 'Failed to fetch artworks');
                    }
                    
                } catch (err) {
                    console.error('Error fetching artworks:', err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchArtworks(currentPage, searchQuery, itemsPerPage);
            }, [currentPage, searchQuery, itemsPerPage]);

            const handleSearch = (e) => {
                e.preventDefault();
                setCurrentPage(1);
                fetchArtworks(1, searchQuery, itemsPerPage);
            };

            const handlePageChange = (newPage) => {
                setCurrentPage(newPage);
            };

            const handleItemsPerPageChange = (e) => {
                const newLimit = parseInt(e.target.value);
                setItemsPerPage(newLimit);
                setCurrentPage(1);
            };

            if (loading && artworks.length === 0) {
                return (
                    <div className="container mx-auto px-4 py-8">
                        <h1 className="text-4xl font-bold text-center text-gray-800 mb-8">
                            Trouv Art - 작품 관리 대시보드
                        </h1>
                        <div className="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6 text-center">
                            <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-4"></div>
                            <p className="text-gray-600">작품 데이터 로딩 중...</p>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="container mx-auto px-4 py-8">
                        <h1 className="text-4xl font-bold text-center text-gray-800 mb-8">
                            Trouv Art - 작품 관리 대시보드
                        </h1>
                        <div className="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6 text-center">
                            <div className="text-red-500 text-6xl mb-4">⚠️</div>
                            <p className="text-red-600 mb-4">데이터 로딩 오류</p>
                            <p className="text-gray-600 text-sm">{error}</p>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                            >
                                새로고침
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container mx-auto px-4 py-8">
                    {/* Header */}
                    <div className="mb-8">
                        <h1 className="text-4xl font-bold text-gray-800 mb-2">
                            Trouv Art - 작품 관리 대시보드
                        </h1>
                        <p className="text-gray-600">
                            AI 아트 추천 서비스 - 총 {totalArtworks.toLocaleString()}개 작품
                        </p>
                    </div>

                    {/* Search and Controls */}
                    <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                            {/* Search */}
                            <form onSubmit={handleSearch} className="flex gap-2 flex-1">
                                <input
                                    type="text"
                                    placeholder="작품명, 작가명으로 검색..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                                <button 
                                    type="submit"
                                    className="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    disabled={loading}
                                >
                                    {loading ? '검색중...' : '검색'}
                                </button>
                            </form>

                            {/* Items per page */}
                            <div className="flex items-center gap-2">
                                <label className="text-sm text-gray-600">페이지당:</label>
                                <select 
                                    value={itemsPerPage} 
                                    onChange={handleItemsPerPageChange}
                                    className="px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value={10}>10개씩</option>
                                    <option value={20}>20개씩</option>
                                    <option value={50}>50개씩</option>
                                    <option value={100}>100개씩</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* Results Info */}
                    <div className="mb-4 text-sm text-gray-600">
                        {((currentPage - 1) * itemsPerPage + 1).toLocaleString()} - {Math.min(currentPage * itemsPerPage, totalArtworks).toLocaleString()} / 전체 {totalArtworks.toLocaleString()}개
                    </div>

                    {/* Artworks Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
                        {artworks.map((artwork) => (
                            <div key={artwork.id} className="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow">
                                <div className="aspect-square bg-gray-200 overflow-hidden">
                                    <img 
                                        src={artwork.image_url} 
                                        alt={artwork.title}
                                        className="w-full h-full object-cover hover:scale-105 transition-transform duration-200"
                                        onError={(e) => {
                                            e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjE4IiBmaWxsPSIjOTk5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+';
                                        }}
                                    />
                                </div>
                                <div className="p-4">
                                    <h3 className="font-semibold text-lg mb-2 line-clamp-2">
                                        {artwork.title}
                                    </h3>
                                    <p className="text-gray-600 text-sm mb-2">
                                        {artwork.artist_name} {artwork.year && `(${artwork.year})`}
                                    </p>
                                    <p className="text-gray-500 text-xs mb-3 line-clamp-2">
                                        {artwork.description}
                                    </p>
                                    <div className="flex flex-wrap gap-1 mb-3">
                                        <span className="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded">
                                            {artwork.category}
                                        </span>
                                        <span className="px-2 py-1 bg-green-100 text-green-800 text-xs rounded">
                                            {artwork.medium}
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className={`px-2 py-1 text-xs rounded ${
                                            artwork.status === 'approved' 
                                                ? 'bg-green-100 text-green-800' 
                                                : 'bg-yellow-100 text-yellow-800'
                                        }`}>
                                            {artwork.status === 'approved' ? '승인됨' : '대기중'}
                                        </span>
                                        {artwork.price && (
                                            <span className="text-sm font-semibold text-gray-900">
                                                ${artwork.price}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Pagination */}
                    {totalPages > 1 && (
                        <div className="flex justify-center items-center gap-2 mt-8">
                            <button
                                onClick={() => handlePageChange(Math.max(1, currentPage - 1))}
                                disabled={currentPage === 1 || loading}
                                className="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                이전
                            </button>
                            
                            {/* Page numbers */}
                            {Array.from({ length: Math.min(5, totalPages) }, (_, i) => {
                                let pageNum;
                                if (totalPages <= 5) {
                                    pageNum = i + 1;
                                } else if (currentPage <= 3) {
                                    pageNum = i + 1;
                                } else if (currentPage >= totalPages - 2) {
                                    pageNum = totalPages - 4 + i;
                                } else {
                                    pageNum = currentPage - 2 + i;
                                }
                                
                                return (
                                    <button
                                        key={pageNum}
                                        onClick={() => handlePageChange(pageNum)}
                                        disabled={loading}
                                        className={`px-3 py-2 rounded-lg ${
                                            pageNum === currentPage
                                                ? 'bg-blue-500 text-white'
                                                : 'bg-white border border-gray-300 hover:bg-gray-50'
                                        } disabled:opacity-50 disabled:cursor-not-allowed`}
                                    >
                                        {pageNum}
                                    </button>
                                );
                            })}
                            
                            <button
                                onClick={() => handlePageChange(Math.min(totalPages, currentPage + 1))}
                                disabled={currentPage === totalPages || loading}
                                className="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                다음
                            </button>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="mt-12 text-center text-gray-500 text-sm">
                        <p>Powered by <a href="https://art-recommendation-saas.onrender.com" className="text-blue-500 hover:text-blue-600">AI Art Recommendation Service</a></p>
                        <p>Data updated in real-time from the main database</p>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ArtworkDashboard />);
    </script>
</body>
</html>
