<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Recommendation - 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React UMD only - no ES modules -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>
        // React 18 UMD에서 createRoot는 ReactDOM에 포함되어 있음
        if (!window.ReactDOM.createRoot) {
            console.error('ReactDOM.createRoot not found!');
        }
    </script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root" class="min-h-screen">
        <!-- Loading placeholder -->
        <div class="container mx-auto px-4 py-8">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
                관리자 대시보드
            </h1>
            <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-gray-600">대시보드 로딩 중...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        // React 18 compatibility - createRoot may not be available in UMD
        const createRoot = ReactDOM.createRoot || ((container) => {
            return {
                render: (element) => ReactDOM.render(element, container)
            };
        });

        // 통계 카드 컴포넌트
        const StatCard = ({ title, value, change, icon, color = "blue" }) => {
            const colorClasses = {
                blue: "bg-blue-500 text-blue-600 bg-blue-50",
                green: "bg-green-500 text-green-600 bg-green-50",
                purple: "bg-purple-500 text-purple-600 bg-purple-50",
                orange: "bg-orange-500 text-orange-600 bg-orange-50"
            };

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <p className="text-sm font-medium text-gray-600">{title}</p>
                            <p className="text-3xl font-bold text-gray-900">{value}</p>
                            {change && (
                                <p className={`text-sm ${change > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                    {change > 0 ? '+' : ''}{change}%
                                </p>
                            )}
                        </div>
                        <div className={`p-3 rounded-full ${colorClasses[color].split(' ')[2]}`}>
                            <div className={`w-6 h-6 ${colorClasses[color].split(' ')[1]}`}>
                                {icon}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 수익 차트 컴포넌트
        const RevenueChart = ({ data }) => {
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            useEffect(() => {
                if (chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    
                    // 기존 차트 제거
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                    }
                    
                    // 데이터를 차트에 맞게 변환
                    let chartData = [];
                    if (data && Array.isArray(data)) {
                        // 이미 배열인 경우 그대로 사용
                        chartData = data;
                    } else if (data && data.monthly_breakdown) {
                        // monthly_breakdown에서 차트 데이터 생성
                        chartData = data.monthly_breakdown.map(item => ({
                            date: item.month,
                            revenue: item.revenue
                        }));
                    } else if (data && data.transactions) {
                        // transactions에서 일일 데이터 생성 (임시)
                        const dailyData = {};
                        data.transactions.forEach(tx => {
                            const date = new Date(tx.date).toISOString().split('T')[0];
                            dailyData[date] = (dailyData[date] || 0) + tx.amount;
                        });
                        chartData = Object.entries(dailyData).map(([date, revenue]) => ({
                            date,
                            revenue
                        }));
                    }
                    
                    // 차트 데이터가 없는 경우 기본 데이터 생성
                    if (chartData.length === 0) {
                        const today = new Date();
                        chartData = Array.from({ length: 7 }, (_, i) => {
                            const date = new Date(today);
                            date.setDate(date.getDate() - i);
                            return {
                                date: date.toISOString().split('T')[0],
                                revenue: Math.floor(Math.random() * 100) + 50
                            };
                        }).reverse();
                    }
                    
                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: chartData.map(d => d.date),
                            datasets: [{
                                label: '일일 수익 ($)',
                                data: chartData.map(d => d.revenue),
                                borderColor: 'rgb(59, 130, 246)',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'top',
                                },
                                title: {
                                    display: true,
                                    text: '수익 트렌드 (지난 30일)'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return '$' + value;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                    }
                };
            }, [data]);

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <canvas ref={chartRef} width="400" height="200"></canvas>
                </div>
            );
        };

        // 사용자 테이블 컴포넌트
        const UserTable = ({ users }) => {
            return (
                <div className="bg-white rounded-lg shadow overflow-hidden">
                    <div className="px-6 py-4 border-b border-gray-200">
                        <h3 className="text-lg font-medium text-gray-900">최근 활성 사용자</h3>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        사용자
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        구독 상태
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        분석 수
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        LTV
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        마지막 활동
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {users.map((user) => (
                                    <tr key={user.id || user.userId}>
                                        <td className="px-6 py-4 whitespace-nowrap">
                                            <div className="flex items-center">
                                                <div className="flex-shrink-0 h-10 w-10">
                                                    <div className="h-10 w-10 rounded-full bg-gray-300 flex items-center justify-center">
                                                        <span className="text-sm font-medium text-gray-700">
                                                            {(user.displayName || user.display_name)?.charAt(0)?.toUpperCase()}
                                                        </span>
                                                    </div>
                                                </div>
                                                <div className="ml-4">
                                                    <div className="text-sm font-medium text-gray-900">
                                                        {user.displayName || user.display_name}
                                                    </div>
                                                    <div className="text-sm text-gray-500">
                                                        {user.email || user.userEmail}
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td className="px-6 py-4 whitespace-nowrap">
                                            <span className={`inline-flex px-2 py-1 text-xs font-semibold rounded-full ${
                                                (user.subscription_tier || user.subscriptionStatus) === 'premium' ? 'bg-purple-100 text-purple-800' :
                                                (user.subscription_tier || user.subscriptionStatus) === 'standard' ? 'bg-blue-100 text-blue-800' :
                                                'bg-gray-100 text-gray-800'
                                            }`}>
                                                {user.subscription_tier || user.subscriptionStatus}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                            {user.total_analyses || user.totalAnalyses || 0}
                                        </td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                            ${user.lifetimeValue || '0'}
                                        </td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            {user.last_login ? new Date(user.last_login).toLocaleDateString('ko-KR') : 
                                             user.lastActive ? new Date(user.lastActive).toLocaleDateString('ko-KR') : 'N/A'}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // 시스템 상태 컴포넌트
        const SystemStatus = ({ systemStats }) => {
            // systemStats가 없는 경우 기본값 처리
            if (!systemStats) {
                return (
                    <div className="bg-white rounded-lg shadow p-6">
                        <h3 className="text-lg font-medium text-gray-900 mb-4">시스템 상태</h3>
                        <div className="text-center text-gray-500">
                            <p>시스템 상태 정보를 불러오는 중...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <h3 className="text-lg font-medium text-gray-900 mb-4">시스템 상태</h3>
                    <div className="space-y-4">
                        <div className="flex justify-between items-center">
                            <span className="text-sm text-gray-600">평균 응답 시간</span>
                            <span className="text-sm font-medium">{systemStats.avgResponseTime || 'N/A'}ms</span>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="text-sm text-gray-600">오류율</span>
                            <span className="text-sm font-medium">{systemStats.errorRate || 'N/A'}%</span>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="text-sm text-gray-600">가동 시간</span>
                            <span className="text-sm font-medium">{systemStats.uptime || 'N/A'}%</span>
                        </div>
                        <div className="mt-6">
                            <h4 className="text-sm font-medium text-gray-900 mb-2">AI 서비스 상태</h4>
                            <div className="space-y-2">
                                {systemStats.services && Object.entries(systemStats.services).map(([service, status]) => (
                                    <div key={service} className="flex justify-between items-center">
                                        <span className="text-sm text-gray-600 capitalize">
                                            {service.replace(/([A-Z])/g, ' $1').trim()}
                                        </span>
                                        <div className={`w-3 h-3 rounded-full ${status ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 메인 대시보드 컴포넌트
        const AdminDashboard = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [dashboardData, setDashboardData] = useState(null);
            const [users, setUsers] = useState([]);
            const [revenueData, setRevenueData] = useState([]);
            const [applications, setApplications] = useState([]);
            const [artworks, setArtworks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [editingApplication, setEditingApplication] = useState(null);
            const [editFormData, setEditFormData] = useState(null);
            const [editingArtwork, setEditingArtwork] = useState(null);
            const [editArtworkData, setEditArtworkData] = useState(null);
            const [showAddArtwork, setShowAddArtwork] = useState(false);
            const [newArtworkData, setNewArtworkData] = useState({
                title: '',
                artist_name: '',
                description: '',
                image_url: '',
                price: '',
                category: 'painting',
                tags: '',
                status: 'pending'
            });
            
            // 작품 관리 탭을 위한 추가 상태들
            const [viewMode, setViewMode] = useState('grid'); // 'grid' or 'table'
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [selectedArtworks, setSelectedArtworks] = useState(new Set()); // 선택된 작품 ID들
            const [isSelectMode, setIsSelectMode] = useState(false); // 선택 모드 여부

            // Mock 관리자 ID (실제로는 인증 시스템에서 가져와야 함)
            const adminUserId = 'admin_user_1';

            useEffect(() => {
                checkAdminAuth();
            }, []);

            const checkAdminAuth = async () => {
                try {
                    // 관리자 토큰 확인
                    const adminToken = localStorage.getItem('admin-token');
                    if (!adminToken) {
                        window.location.href = '/admin.html';
                        return;
                    }

                    // 서버에서 관리자 토큰 검증
                    const authResponse = await fetch('/api/admin/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${adminToken}`
                        }
                    });

                    if (authResponse.ok) {
                        const authResult = await authResponse.json();
                        if (authResult.valid) {
                            setIsAuthenticated(true);
                            loadDashboardData();
                        } else {
                            localStorage.removeItem('admin-token');
                            window.location.href = '/admin.html';
                        }
                    } else {
                        localStorage.removeItem('admin-token');
                        window.location.href = '/admin.html';
                    }
                } catch (error) {
                    console.error('Dashboard auth check error:', error);
                    localStorage.removeItem('admin-token');
                    window.location.href = '/admin.html';
                }
            };

            const loadDashboardData = async () => {
                try {
                    setLoading(true);
                    
                    const adminToken = localStorage.getItem('admin-token');
                    const headers = {
                        'Authorization': `Bearer ${adminToken}`
                    };
                    
                    // 대시보드 통계 로드
                    const statsResponse = await fetch(`/api/admin/dashboard/stats?userId=${adminUserId}`, { headers });
                    const statsResult = await statsResponse.json();
                    
                    if (statsResult.success) {
                        setDashboardData(statsResult.data);
                    }

                    // 사용자 데이터 로드
                    console.log('Fetching users from:', `/api/admin/dashboard/users?userId=${adminUserId}&limit=20`);
                    const usersResponse = await fetch(`/api/admin/dashboard/users?userId=${adminUserId}&limit=20`, { headers });
                    console.log('Users response status:', usersResponse.status);
                    const usersResult = await usersResponse.json();
                    console.log('Users response data:', usersResult);
                    
                    if (usersResult.success) {
                        setUsers(usersResult.data);
                        console.log('Users state set to:', usersResult.data);
                    } else {
                        console.error('Failed to load users:', usersResult.error);
                        setError(`회원 목록 로드 실패: ${usersResult.error || '알 수 없는 오류'}`);
                    }

                    // 수익 데이터 로드
                    const revenueResponse = await fetch(`/api/admin/dashboard/revenue?userId=${adminUserId}&days=30`, { headers });
                    const revenueResult = await revenueResponse.json();
                    
                    if (revenueResult.success) {
                        setRevenueData(revenueResult.data);
                    }

                    // 예술가 신청 데이터 로드
                    const applicationsResponse = await fetch(`/api/admin/artist-applications`, { headers });
                    const applicationsResult = await applicationsResponse.json();
                    
                    if (applicationsResult.success) {
                        setApplications(applicationsResult.applications || []);
                    }

                    // 작품 데이터 로드
                    const artworksResponse = await fetch(`/api/admin/artworks`, { headers });
                    const artworksResult = await artworksResponse.json();
                    
                    if (artworksResult.success) {
                        setArtworks(artworksResult.artworks || []);
                    }

                } catch (error) {
                    console.error('Dashboard loading error:', error);
                    setError('대시보드 데이터를 불러오는 중 오류가 발생했습니다.');
                } finally {
                    setLoading(false);
                }
            };

            const handleApplicationReview = async (applicationId, action, reviewNotes = '') => {
                try {
                    const response = await fetch('/api/admin/artist-applications/review', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            applicationId,
                            action,
                            reviewNotes
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert(action === 'approve' ? '예술가 신청이 승인되었습니다.' : '예술가 신청이 거부되었습니다.');
                        loadDashboardData(); // 데이터 새로고침
                    } else {
                        alert('처리 중 오류가 발생했습니다: ' + result.error);
                    }
                } catch (error) {
                    console.error('Application review error:', error);
                    alert('서버 오류가 발생했습니다.');
                }
            };

            // 예술가 신청 수정 핸들러
            const handleEditApplication = (application) => {
                setEditingApplication(application);
                setEditFormData({
                    artist_name: application.artist_name,
                    bio: application.bio,
                    statement: application.statement,
                    portfolio_url: application.portfolio_url || '',
                    instagram_url: application.instagram_url || '',
                    experience: application.experience,
                    specialties: application.specialties.join(', ')
                });
            };

            const handleEditFormChange = (e) => {
                const { name, value } = e.target;
                setEditFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleEditFormSubmit = async (e) => {
                e.preventDefault();
                
                try {
                    const updatedData = {
                        ...editFormData,
                        specialties: editFormData.specialties.split(',').map(s => s.trim()).filter(s => s)
                    };

                    const response = await fetch(`/api/admin/artist-applications/${editingApplication.id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(updatedData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('예술가 신청이 수정되었습니다.');
                        setEditingApplication(null);
                        setEditFormData(null);
                        loadDashboardData(); // 데이터 새로고침
                    } else {
                        alert('수정 중 오류가 발생했습니다: ' + result.error);
                    }
                } catch (error) {
                    console.error('Application edit error:', error);
                    alert('서버 오류가 발생했습니다.');
                }
            };

            const cancelEdit = () => {
                setEditingApplication(null);
                setEditFormData(null);
            };

            // 작품 관리 핸들러들
            const handleEditArtwork = (artwork) => {
                setEditingArtwork(artwork);
                setEditArtworkData({
                    title: artwork.title,
                    artist_name: artwork.artist_name,
                    description: artwork.description || '',
                    image_url: artwork.image_url || '',
                    price: artwork.price || '',
                    category: artwork.category || 'painting',
                    tags: artwork.tags || '',
                    status: artwork.status || 'pending'
                });
            };

            const handleEditArtworkChange = (e) => {
                const { name, value } = e.target;
                setEditArtworkData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleEditArtworkSubmit = async (e) => {
                e.preventDefault();
                
                try {
                    const adminToken = localStorage.getItem('admin-token');
                    const response = await fetch(`/api/admin/artworks/${editingArtwork.id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${adminToken}`
                        },
                        body: JSON.stringify(editArtworkData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('작품이 수정되었습니다.');
                        setEditingArtwork(null);
                        setEditArtworkData(null);
                        loadDashboardData();
                    } else {
                        alert('수정 중 오류가 발생했습니다: ' + result.error);
                    }
                } catch (error) {
                    console.error('Artwork edit error:', error);
                    alert('서버 오류가 발생했습니다.');
                }
            };

            const handleDeleteArtwork = async (artworkId) => {
                if (!confirm('정말로 이 작품을 삭제하시겠습니까?')) {
                    return;
                }
                
                try {
                    const adminToken = localStorage.getItem('admin-token');
                    const response = await fetch(`/api/admin/artworks/${artworkId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${adminToken}`
                        }
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('작품이 삭제되었습니다.');
                        loadDashboardData();
                    } else {
                        alert('삭제 중 오류가 발생했습니다: ' + result.error);
                    }
                } catch (error) {
                    console.error('Artwork delete error:', error);
                    alert('서버 오류가 발생했습니다.');
                }
            };
            
            // 다중 선택 관련 함수들
            const toggleSelectMode = () => {
                setIsSelectMode(!isSelectMode);
                setSelectedArtworks(new Set()); // 모드 변경 시 선택 초기화
            };
            
            const toggleArtworkSelection = (artworkId) => {
                const newSelected = new Set(selectedArtworks);
                if (newSelected.has(artworkId)) {
                    newSelected.delete(artworkId);
                } else {
                    newSelected.add(artworkId);
                }
                setSelectedArtworks(newSelected);
            };
            
            const selectAllArtworks = () => {
                const filtered = artworks.filter(artwork => {
                    const matchesSearch = searchTerm === '' || 
                        artwork.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        artwork.artist_name.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesStatus = filterStatus === 'all' || artwork.status === filterStatus;

                    return;

                const adminToken = localStorage.getItem('admin-token');
                let successCount = 0;
                let failCount = 0;
                
                for (const artworkId of selectedArtworks) {
                    try {
                        const response = await fetch(`/api/admin/artworks/${artworkId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${adminToken}`
                            }
                        });
                        
                        if (response.ok) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    } catch (error) {
                        console.error(`Error deleting artwork ${artworkId}:`, error);
                        failCount++;
                    }
                }
                
                alert(`삭제 완료: 성공 ${successCount}개, 실패 ${failCount}개`);
                setSelectedArtworks(new Set());
                setIsSelectMode(false);

                    } else {

                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    예술가 이름 *
                                                </label>
                                                <input
                                                    type="text"
                                                    name="artist_name"
                                                    value={editFormData.artist_name}
                                                    onChange={handleEditFormChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                    required
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    작품 소개
                                                </label>
                                                <textarea
                                                    name="bio"
                                                    value={editFormData.bio}
                                                    onChange={handleEditFormChange}
                                                    rows={4}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    작가 소명
                                                </label>
                                                <textarea
                                                    name="statement"
                                                    value={editFormData.statement}
                                                    onChange={handleEditFormChange}
                                                    rows={4}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>
                                        </div>

                                        {/* 오른쪽 컬럼 */}
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    포트폴리오 URL
                                                </label>
                                                <input
                                                    type="url"
                                                    name="portfolio_url"
                                                    value={editFormData.portfolio_url}
                                                    onChange={handleEditFormChange}
                                                    placeholder="https://portfolio.example.com"
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    인스타그램
                                                </label>
                                                <input
                                                    type="text"
                                                    name="instagram_url"
                                                    value={editFormData.instagram_url}
                                                    onChange={handleEditFormChange}
                                                    placeholder="@username"
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    경력 수준
                                                </label>
                                                <select
                                                    name="experience"
                                                    value={editFormData.experience}
                                                    onChange={handleEditFormChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                >
                                                    <option value="beginner">초급 (1년 미만)</option>
                                                    <option value="intermediate">중급 (1-3년)</option>
                                                    <option value="advanced">고급 (3-10년)</option>
                                                    <option value="professional">전문가 (10년 이상)</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    전문 분야 (쉼표로 구분)
                                                </label>
                                                <input
                                                    type="text"
                                                    name="specialties"
                                                    value={editFormData.specialties}
                                                    onChange={handleEditFormChange}
                                                    placeholder="회화, 조각, 디지털아트"
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 flex justify-end space-x-3">
                                        <button
                                            type="button"
                                            onClick={cancelEdit}
                                            className="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50"
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
                                        >
                                            수정 완료
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 앱 렌더링
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = createRoot(rootElement);
            root.render(React.createElement(AdminDashboard));
        }
    </script>
    
    <!-- Note: app.tsx is available for ES module imports via import map -->
</body>
</html>
