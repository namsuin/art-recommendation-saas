<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        function TestDashboard() {
            const [isSelectMode, setIsSelectMode] = useState(false);
            const [selectedItems, setSelectedItems] = useState(new Set());
            
            const toggleSelectMode = () => {
                setIsSelectMode(!isSelectMode);
                setSelectedItems(new Set());
            };
            
            const mockArtworks = [
                { id: 1, title: "작품 1", artist: "작가 1" },
                { id: 2, title: "작품 2", artist: "작가 2" },
                { id: 3, title: "작품 3", artist: "작가 3" }
            ];
            
            const toggleSelection = (id) => {
                const newSelected = new Set(selectedItems);
                if (newSelected.has(id)) {
                    newSelected.delete(id);
                } else {
                    newSelected.add(id);
                }
                setSelectedItems(newSelected);
            };
            
            const handleBulkDelete = () => {
                alert(`${selectedItems.size}개 항목을 삭제합니다.`);
            };
            
            return (
                <div className="p-8">
                    <h1 className="text-2xl font-bold mb-4">다중 선택 테스트</h1>
                    
                    <div className="mb-4 space-x-2">
                        {isSelectMode ? (
                            <>
                                <button 
                                    onClick={() => setSelectedItems(new Set(mockArtworks.map(a => a.id)))}
                                    className="px-4 py-2 bg-blue-500 text-white rounded"
                                >
                                    전체 선택
                                </button>
                                <button 
                                    onClick={() => setSelectedItems(new Set())}
                                    className="px-4 py-2 border rounded"
                                >
                                    선택 해제
                                </button>
                                <button 
                                    onClick={handleBulkDelete}
                                    className="px-4 py-2 bg-red-500 text-white rounded"
                                >
                                    선택 삭제 ({selectedItems.size})
                                </button>
                                <button 
                                    onClick={toggleSelectMode}
                                    className="px-4 py-2 border rounded"
                                >
                                    선택 모드 종료
                                </button>
                            </>
                        ) : (
                            <button 
                                onClick={toggleSelectMode}
                                className="px-4 py-2 bg-purple-500 text-white rounded"
                            >
                                ☑️ 다중 선택
                            </button>
                        )}
                    </div>
                    
                    <div className="grid grid-cols-3 gap-4">
                        {mockArtworks.map(artwork => (
                            <div 
                                key={artwork.id} 
                                className={`p-4 border rounded ${isSelectMode && selectedItems.has(artwork.id) ? 'border-blue-500 bg-blue-50' : ''}`}
                            >
                                {isSelectMode && (
                                    <div className="mb-2">
                                        <input
                                            type="checkbox"
                                            checked={selectedItems.has(artwork.id)}
                                            onChange={() => toggleSelection(artwork.id)}
                                        />
                                        <span className="ml-2">선택</span>
                                    </div>
                                )}
                                <h3>{artwork.title}</h3>
                                <p>{artwork.artist}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<TestDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
